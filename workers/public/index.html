<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Delhi Pulse &mdash; Bus Journey Planner</title>
<meta name="description" content="Plan a DTC bus journey across Delhi with travel times learned from real bus GPS data."/>
<meta name="theme-color" content="#ffffff"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314211b'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23ffb000'/%3E%3C/svg%3E"/>
<link rel="preload" href="vendor/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preconnect" href="https://maps.googleapis.com"/>
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin/>
<link href="app.css" rel="stylesheet"/>
<script src="shared.js" defer></script>
<script src="planner.js" defer></script>
</head>
<body>
<a class="skip-link" href="#panel">Skip to journey planner</a>

<header class="bar">
  <a class="brand" href="./" aria-label="Delhi Pulse home"><span class="plate plate-brand">Delhi Pulse</span></a>
  <nav class="views" aria-label="Views">
    <a href="./" aria-current="page">Planner</a>
    <a href="pulse.html">City Pulse</a>
    <a href="playground.html">API</a>
  </nav>
  <p class="bar-status" id="netstats">Connecting&hellip;</p>
</header>

<main class="shell">
  <section class="panel" id="panel" aria-labelledby="planTitle" tabindex="-1">
    <form class="trip" id="planForm" autocomplete="off" novalidate>
      <h1 class="panel-title" id="planTitle">Plan a bus journey</h1>

      <div class="od">
        <div class="field combo" id="fromField">
          <div class="label-row">
            <label for="from">From</label>
            <button type="button" class="text-btn" id="locate">Use my location</button>
          </div>
          <input id="from" name="from" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fromSug" placeholder="Stop or landmark" autocomplete="off" spellcheck="false" enterkeyhint="search"/>
          <div class="sug" id="fromSug" role="listbox" aria-label="Start suggestions" hidden></div>
        </div>
        <div class="field combo" id="toField">
          <label for="to">To</label>
          <input id="to" name="to" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="toSug" placeholder="Stop or landmark" autocomplete="off" spellcheck="false" enterkeyhint="search"/>
          <div class="sug" id="toSug" role="listbox" aria-label="Destination suggestions" hidden></div>
        </div>
        <button type="button" class="icon-btn swap" id="swap" aria-label="Swap start and destination">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4M7 4 3.5 7.5M7 4l3.5 3.5M17 4v16M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg>
        </button>
      </div>

      <div class="row">
        <div class="field">
          <div class="label-row">
            <label for="when">Depart</label>
            <button type="button" class="text-btn" id="now">Now</button>
          </div>
          <input id="when" name="when" type="datetime-local"/>
        </div>
        <div class="field" id="asofField" hidden>
          <label for="asof">Replay a recorded day</label>
          <select id="asof" name="asof">
            <option value="">Typical day</option>
          </select>
        </div>
      </div>

      <p class="form-msg" id="formMsg" role="alert" hidden></p>
      <button id="plan" class="plan-btn" type="submit">Find journeys</button>
      <p class="hint" id="mapHint">Or pick your start on the map.</p>
    </form>

    <p class="sr-only" id="planStatus" role="status"></p>
    <div id="results"></div>
    <p class="panel-foot" id="stats" hidden></p>
  </section>

  <section class="map-wrap" aria-label="Map of Delhi showing your start, destination and the selected journey">
    <div id="map"></div>
  </section>
</main>
</body>
</html>
