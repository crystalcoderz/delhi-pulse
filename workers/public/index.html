<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Delhi Pulse â€” Bus Journey Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233ddc97'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2310121b'/%3E%3C/svg%3E"/>
<script src="/vendor/maplibre-gl.js"></script>
<link href="/vendor/maplibre-gl.css" rel="stylesheet"/>
<style>
  :root {
    --bg: #0b0d14; --panel: #14171f; --card: #1a1e2a; --border: #252b3d;
    --ink: #e8eaf2; --dim: #8b90a5; --acc: #3ddc97; --acc2: #2ea5f7;
    --warn: #ffb347; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink);
         font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib { display: none; }

  /* ---------- top bar ---------- */
  .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            background: linear-gradient(180deg, rgba(11,13,20,.95) 0%, rgba(11,13,20,0) 100%);
            padding: 12px 16px 24px; pointer-events: none; }
  .topbar-inner { pointer-events: auto; max-width: 520px; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
           pointer-events: auto; }
  .brand-icon { width: 32px; height: 32px; border-radius: 9px;
               background: var(--acc); display: flex; align-items: center;
               justify-content: center; font-size: 14px; font-weight: 800; color: #06281a; }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .brand .sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .brand .sub b { color: var(--acc); font-weight: 600; }

  /* ---------- search panel ---------- */
  .search-panel { background: var(--panel); border: 1px solid var(--border);
                 border-radius: 16px; padding: 14px;
                 box-shadow: 0 4px 28px rgba(0,0,0,.5); }
  .field { position: relative; margin-bottom: 8px; }
  .field input, .field select { width: 100%; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: #0d0f18; color: var(--ink);
    font-size: 14px; outline: none; transition: border .15s; }
  .field input:focus { border-color: var(--acc); }
  .field input::placeholder { color: #555b6e; }
  .swap-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
             width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
             background: var(--card); cursor: pointer; display: flex; align-items: center;
             justify-content: center; font-size: 14px; color: var(--dim); }
  .sug { position: absolute; left: 0; right: 0; top: 46px; background: #0d0f18;
         border: 1px solid var(--border); border-radius: 12px; z-index: 20;
         max-height: 220px; overflow: auto; display: none;
         box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  .sug-item { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between;
              align-items: center; }
  .sug-item:hover { background: var(--card); }
  .sug-item .nm { font-size: 13px; line-height: 1.3; }
  .sug-item .dst { font-size: 11px; color: var(--dim); white-space: nowrap; margin-left: 8px; }

  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; margin-bottom: 0; }

  .plan-btn { width: 100%; margin-top: 10px; padding: 13px; border: none;
             border-radius: 12px; background: linear-gradient(135deg, var(--acc), #35b87e);
             color: #06281a; font-weight: 800; font-size: 15px; cursor: pointer;
             transition: filter .15s; letter-spacing: .3px; }
  .plan-btn:hover { filter: brightness(1.12); }
  .plan-btn:disabled { opacity: .5; cursor: wait; }
  .plan-btn:active { transform: scale(.98); }

  .asof-hint { margin-top: 8px; font-size: 11px; color: var(--dim); text-align: center; }
  .asof-hint b { color: var(--acc2); font-weight: 600; }
  .clear-asof { display: none; width: 100%; margin-top: 6px; padding: 8px;
               font-size: 12px; background: var(--card); border: 1px solid var(--border);
               border-radius: 10px; color: var(--dim); cursor: pointer; }
  .clear-asof:hover { color: var(--ink); }
  .clear-asof.visible { display: block; }

  #when { color-scheme: dark; }
  #asof { color-scheme: dark; }

  /* ---------- results ---------- */
  #results { margin-top: 12px; display: flex; flex-direction: column; gap: 10px;
             max-height: calc(100vh - 380px); overflow-y: auto;
             scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #results::-webkit-scrollbar { width: 6px; }
  #results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .card { background: var(--panel); border: 1px solid var(--border);
         border-radius: 16px; padding: 14px 16px; cursor: pointer;
         transition: border .15s, transform .1s; }
  .card:hover, .card.sel { border-color: var(--acc); transform: translateY(1px); }

  .card-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .card-header .eta { font-size: 26px; font-weight: 800; letter-spacing: -.5px;
                      color: var(--ink); }
  .card-header .range { font-size: 11px; color: var(--dim); }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px;
          font-weight: 700; white-space: nowrap; }
  .badge.walk { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
  .badge.bus { background: var(--acc); color: #06281a; }
  .badge.bus .n { font-size: 11px; font-weight: 400; opacity: .75; margin-left: 4px; }
  .badge.wait { background: var(--card); color: var(--warn); border: 1px solid var(--border); }
  .badge.transfer { background: rgba(255,179,71,.15); color: var(--warn);
                   border: 1px solid rgba(255,179,71,.3); font-size: 11px; }
  .badge.usual { background: rgba(46,165,247,.12); color: var(--acc2);
                 border: 1px solid rgba(46,165,247,.25); font-size: 10px; margin-left: auto; }

  .meta { font-size: 12px; color: var(--dim); line-height: 1.5; }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .arr { color: var(--acc); font-weight: 700; }

  .error-card { background: rgba(255,107,107,.08); border-color: rgba(255,107,107,.3);
               text-align: center; cursor: default; }
  .error-card .meta { color: var(--bad); }
  .error-card:hover { border-color: rgba(255,107,107,.3); transform: none; }

  /* ---------- bottom sheet ---------- */
  #stats { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
           z-index: 6; background: rgba(11,13,20,.85); backdrop-filter: blur(12px);
           border: 1px solid var(--border); border-radius: 20px;
           padding: 8px 20px; font-size: 11px; color: var(--dim);
           white-space: nowrap; pointer-events: none; }
  #stats b { color: var(--acc); font-weight: 700; }

  /* ---------- mobile ---------- */
  @media (max-width: 768px) {
    .topbar { padding: 8px 10px 16px; }
    .topbar-inner { max-width: none; }
    .brand h1 { font-size: 16px; }
    .brand-icon { width: 28px; height: 28px; font-size: 12px; }
    .search-panel { border-radius: 12px; padding: 10px; }
    .card-header .eta { font-size: 22px; }
    #stats { font-size: 10px; bottom: 6px; padding: 6px 14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon"> DP</div>
      <div>
        <h1>Delhi Pulse</h1>
        <div class="sub"><b id="netstats">connectingâ€¦</b></div>
      </div>
      <a href="/pulse.html" style="margin-left:auto;color:var(--acc);text-decoration:none;font-size:12px;font-weight:600;background:rgba(61,220,151,.1);padding:6px 14px;border-radius:10px;border:1px solid rgba(61,220,151,.25)">â— City Pulse</a>
    </div>

    <div class="search-panel">
      <div class="field">
        <input id="from" placeholder="From â€” stop name or tap the map"/>
        <div class="sug" id="fromSug"></div>
      </div>
      <div class="field">
        <input id="to" placeholder="To â€” stop name or tap the map"/>
        <div class="sug" id="toSug"></div>
      </div>
      <div class="row">
        <div class="field">
          <input id="when" type="datetime-local"/>
        </div>
        <div class="field">
          <input id="asof" type="date" title="Time-travel: replay October observed speeds"/>
        </div>
      </div>
      <button id="plan" class="plan-btn">Find Journeys</button>
      <button id="clearAsof" class="clear-asof">âœ• Switch back to typical day</button>
      <div class="asof-hint">Pick a date in the second box to <b>time-travel</b> â€” re-plan with that October day's observed bus speeds</div>
    </div>

    <div id="results"></div>
  </div>
</div>

<div id="stats">â—¦</div>

<script>
const API = location.origin;
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [77.21, 28.62], zoom: 10.5, pitch: 0
});
window.map = map;
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
let picks = {from: null, to: null}, clickMode = 'from';
let markers = [], allLayers = [], allSources = [];

const $ = id => document.getElementById(id);

function nowLocalISO() {
  const n = new Date();
  n.setMinutes(n.getMinutes() - n.getTimezoneOffset());
  return n.toISOString().slice(0, 16);
}
$('when').value = nowLocalISO();

// ---------- network stats ----------
fetch(`${API}/status`).then(r=>r.json()).then(s=>{
  const routes = s.routes || 0, stops = 0;
  const mode = s.live?.vehicles > 0 ? ` Â· <b style="color:#3ddc97">LIVE</b> (ðŸšŒ ${s.live.vehicles})` : '';
  $('netstats').innerHTML = `bus traffic model for Delhi${mode}`;
  $('stats').innerHTML = `<b>${routes}</b> routes Â· <b>839k</b> quantile cells Â· <b>669k</b> trips observed${mode}`;
}).catch(()=>{ $('netstats').textContent = 'bus traffic model for Delhi'; });

// ---------- stop search ----------
async function suggest(box, sugBox) {
  const q = box.value.trim();
  if (q.length < 2) { sugBox.style.display='none'; return; }
  try {
    const r = await fetch(`${API}/stops/search?q=${encodeURIComponent(q)}`).then(r=>r.json());
    sugBox.innerHTML = '';
    (r||[]).forEach(s=>{
      const d = document.createElement('div'); d.className='sug-item';
      d.innerHTML = `<span class="nm">${s.name}</span><span class="dst">${s.stop_id}</span>`;
      d.onclick = () => {
        setPoint(sugBox.id === 'fromSug' ? 'from' : 'to', s.name,
                 [s.lng, s.lat], s.stop_id);
        box.value = s.name;
        sugBox.style.display = 'none';
      };
      sugBox.appendChild(d);
    });
    sugBox.style.display = r.length ? 'block' : 'none';
  } catch(e) {}
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
$('from').oninput = debounce(e=>suggest($('from'), $('fromSug')), 250);
$('to').oninput   = debounce(e=>suggest($('to'), $('toSug')), 250);
['fromSug','toSug'].forEach(id=>{
  $(id).addEventListener('click', e=>{ if(e.target.tagName!=='DIV') $(id).style.display='none'; });
});
document.addEventListener('click', e=>{
  if (!e.target.closest('.field')) { $('fromSug').style.display='none'; $('toSug').style.display='none'; }
});

// ---------- map clicks ----------
map.on('click', e => {
  if (e.originalEvent.target.closest('.search-panel')) return;
  const which = clickMode;
  setPoint(which, `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`,
           [e.lngLat.lng, e.lngLat.lat], null);
  clickMode = which === 'from' ? 'to' : 'from';
});

function setPoint(which, label, coord, stopId) {
  picks[which] = { label, coord, stopId };
  const el = document.createElement('div');
  el.textContent = which === 'from' ? 'A' : 'B';
  el.style.cssText = `width:${which==='from'?'var(--acc)':'var(--acc2)'};
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:800;color:#0b0d14;
    background:${which==='from'?'var(--acc)':'var(--acc2)'};
    border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 8px rgba(0,0,0,.5)`;
  markers.push(new maplibregl.Marker({element:el}).setLngLat(coord).addTo(map));
  if (which === 'from') $('from').value = label;
  if (which === 'to') $('to').value = label;
  if (picks.from && picks.to) plan();
  else if (which === 'from') $('to').placeholder = 'Tap the map for destination';
}

function clearRoute() {
  allLayers.forEach(id => { if (map.getLayer(id)) map.removeLayer(id);
    if (map.getSource(id)) map.removeSource(id); });
  allLayers = []; allSources = [];
}

// ---------- plan ----------
$('plan').onclick = plan;
$('clearAsof').onclick = () => { $('asof').value = '';
  $('clearAsof').classList.remove('visible'); plan(); };

async function plan() {
  clearRoute();
  markers.forEach(m => m.remove()); markers = [];
  if (picks.from) {
    const el = document.createElement('div');
    el.textContent = 'A'; el.style.cssText = 'background:var(--acc);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b0d14;border:2px solid rgba(255,255,255,.2)';
    markers.push(new maplibregl.Marker({element:el}).setLngLat(picks.from.coord).addTo(map));
  }
  if (picks.to) {
    const el = document.createElement('div');
    el.textContent = 'B'; el.style.cssText = 'background:var(--acc2);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b0d14;border:2px solid rgba(255,255,255,.2)';
    markers.push(new maplibregl.Marker({element:el}).setLngLat(picks.to.coord).addTo(map));
  }

  const fromVal = picks.from
    ? (picks.from.stopId ? `stop:${picks.from.stopId}` :
       `${picks.from.coord[1]},${picks.from.coord[0]}`)
    : $('from').value;
  const toVal = picks.to
    ? (picks.to.stopId ? `stop:${picks.to.stopId}` :
       `${picks.to.coord[1]},${picks.to.coord[0]}`)
    : $('to').value;
  if (!fromVal || !toVal) return;

  $('plan').disabled = true; $('plan').textContent = 'Findingâ€¦';
  const dep = $('when').value ? new Date($('when').value).toISOString() : '';
  const asof = $('asof').value ? $('asof').value + 'T08:00:00+05:30' : '';
  if (asof) $('clearAsof').classList.add('visible');

  try {
    const url = `${API}/journeys?from=${encodeURIComponent(fromVal)}&to=${encodeURIComponent(toVal)}`
      + (dep ? `&depart=${encodeURIComponent(dep)}` : '')
      + (asof ? `&asOf=${encodeURIComponent(asof)}` : '')
      + `&max=4`;
    const res = await fetch(url).then(r => r.json());
    render(res);
  } catch(e) {
    render({error: e.message, options: []});
  } finally {
    $('plan').disabled = false; $('plan').textContent = 'Find Journeys';
  }
}

function render(res) {
  const box = $('results');
  box.innerHTML = '';
  const opts = res.options || [];
  if (!opts.length) {
    box.innerHTML = `<div class="card error-card"><div class="meta">${
      res.note || res.error || 'No bus route found â€” try destinations closer to a bus network area.'
    }</div></div>`;
    return;
  }
  opts.forEach((o, idx) => {
    const c = document.createElement('div');
    c.className = 'card'; if (idx === 0) c.classList.add('sel');

    const badges = [];
    if (o.walk_o > 0) badges.push(`<span class="badge walk">ðŸš¶ ${Math.round(o.walk_o)}m</span>`);
    if (o.transfers === 0) {
      badges.push(`<span class="badge bus">${o.route_name}</span>`);
    } else {
      (o.route_name || '').split(/\s+\+\s+/).forEach(rt => {
        if (rt) badges.push(`<span class="badge bus">${rt}</span>`);
      });
      if (o.transfer_name) badges.push(`<span class="badge transfer">â‡„ ${o.transfer_name}</span>`);
    }
    if (o.wait_min) badges.push(`<span class="badge wait">â± ${Math.round(o.wait_min)}m</span>`);
    if (o.walk_d > 0) badges.push(`<span class="badge walk">ðŸš¶ ${Math.round(o.walk_d)}m</span>`);
    if (o.rush_effect_min != null && o.rush_effect_min !== 0) {
      const eff = o.rush_effect_min > 0 ? `+${o.rush_effect_min}m vs quiet` : `${o.rush_effect_min}m vs quiet`;
      badges.push(`<span class="badge usual">${eff}</span>`);
    }

    const arrive = o.arrive ? new Date(o.arrive).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const board = o.board_name || '';
    const alight = o.alight_name || '';

    c.innerHTML = `
      <div class="card-header">
        <span class="eta">${Math.round(o.eta_p50_min)}</span>
        <span class="eta" style="font-size:14px;color:var(--dim)">min</span>
        ${o.eta_p10_min !== o.eta_p50_min ? `<span class="range">${Math.round(o.eta_p10_min)}â€“${Math.round(o.eta_p90_min)} min</span>` : ''}
      </div>
      <div class="badge-row">${badges.join('')}</div>
      <div class="meta">
        Board <b>${board}</b> ${o.transfer_name ? `â†’ change at <b>${o.transfer_name}</b>` : ''} â†’ alight <b>${alight}</b><br/>
        <span class="arr">Arrive ~${arrive}</span>${o.usual_p50_min && o.usual_p50_min != o.eta_p50_min ? ` Â· usually ${Math.round(o.usual_p50_min)} min at quiet hour ${o.usual_hour_ist}:00` : ''}
      </div>`;
    c.onclick = () => {
      document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      draw(o);
    };
    box.appendChild(c);
    if (idx === 0) draw(o);
  });
}

function draw(o) {
  clearRoute();
  o.legs.forEach(l => {
    if (l.type === 'transfer') return;
    const id = (l.type === 'bus' ? 'bus-' : 'wk-') + Math.random().toString(36).slice(2);
    const coords = l.stops || l.coords || [];
    if (coords.length < 2) return;
    map.addSource(id, {type:'geojson', data:{
      type:'Feature', properties:{},
      geometry:{type:'LineString', coordinates: coords.map(c=>[c[1],c[0]])}
    }});
    if (l.type === 'bus') {
      map.addLayer({id, type:'line', source:id,
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#3ddc97','line-width':4,'line-opacity':.85}});
    } else {
      map.addLayer({id, type:'line', source:id,
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#8b90a5','line-width':2.5,'line-dasharray':[2,3]}});
    }
    allLayers.push(id);
  });
  const allCoords = [];
  o.legs.forEach(l => (l.stops || l.coords || []).forEach(c => allCoords.push(c)));
  if (allCoords.length >= 2) {
    map.fitBounds(allCoords.reduce((b,c)=>b.extend([c[1],c[0]]),
      new maplibregl.LngLatBounds(allCoords[0].length > 2 ?
        [allCoords[0][1], allCoords[0][0]] : [allCoords[0][1], allCoords[0][0]],
        [allCoords[0][1], allCoords[0][0]])), {padding: 60});
  }
}
</script>
</body>
</html>
